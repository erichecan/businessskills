<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>职场表达力 · 痛点库</title>
<style>
  :root {
    --bg: #111110;
    --surface: #1c1c1a;
    --surface2: #242422;
    --surface3: #2e2e2b;
    --ink: #f0ede4;
    --ink2: #b8b4a8;
    --ink3: #706d63;
    --gold: #e8d5a3;
    --gold-dim: #a89870;
    --line: #2e2e2b;

    --c-ms: #3b7dd8;   /* 面试 */
    --c-tx: #2e9e6b;   /* 谈薪 */
    --c-hb: #d87a3b;   /* 汇报 */
    --c-xs: #8b5cf6;   /* 向上管理 */

    --sev-h: #e05555;
    --sev-m: #d87a3b;
    --sev-l: #606060;

    --radius: 8px;
    --radius-sm: 5px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", sans-serif;
    font-size: 14px;
    line-height: 1.6;
    min-height: 100vh;
  }

  /* ── Header ─────────────────────────────── */
  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .header-title {
    font-size: 17px;
    font-weight: 600;
    color: var(--gold);
    letter-spacing: 0.03em;
    white-space: nowrap;
  }

  .header-stats {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .stat-chip {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 3px 10px;
    background: var(--surface2);
    border: 1px solid var(--line);
    border-radius: 20px;
    font-size: 12px;
    color: var(--ink2);
  }

  .stat-chip .dot {
    width: 8px; height: 8px; border-radius: 50%;
  }

  .stat-chip .count { font-weight: 600; color: var(--ink); }

  .header-right { margin-left: auto; }

  .btn-extract {
    background: var(--gold);
    color: #1a1a14;
    border: none;
    padding: 7px 16px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: opacity .15s;
  }
  .btn-extract:hover { opacity: 0.85; }

  /* ── Filters ─────────────────────────────── */
  .filters {
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    padding: 10px 24px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .tabs {
    display: flex;
    gap: 4px;
  }

  .tab {
    padding: 5px 14px;
    border-radius: 20px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink2);
    font-size: 13px;
    cursor: pointer;
    transition: all .15s;
    white-space: nowrap;
  }
  .tab:hover { border-color: var(--ink3); color: var(--ink); }
  .tab.active {
    border-color: transparent;
    color: #fff;
    font-weight: 600;
  }
  .tab[data-scenario="all"].active { background: var(--gold-dim); color: #1a1a14; }
  .tab[data-scenario="面试"].active { background: var(--c-ms); }
  .tab[data-scenario="谈薪"].active { background: var(--c-tx); }
  .tab[data-scenario="汇报"].active { background: var(--c-hb); }
  .tab[data-scenario="向上管理"].active { background: var(--c-xs); }

  .divider { width: 1px; height: 24px; background: var(--line); flex-shrink: 0; }

  .filter-select {
    background: var(--surface2);
    border: 1px solid var(--line);
    color: var(--ink2);
    padding: 5px 10px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    cursor: pointer;
    outline: none;
  }
  .filter-select:focus { border-color: var(--gold-dim); }

  .search-wrap {
    position: relative;
    flex: 1;
    max-width: 280px;
  }

  .search-wrap svg {
    position: absolute;
    left: 9px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--ink3);
    pointer-events: none;
  }

  .search-input {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--line);
    color: var(--ink);
    padding: 5px 10px 5px 30px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    outline: none;
  }
  .search-input::placeholder { color: var(--ink3); }
  .search-input:focus { border-color: var(--gold-dim); }

  .result-count {
    margin-left: auto;
    color: var(--ink3);
    font-size: 12px;
    white-space: nowrap;
  }

  /* ── Main Grid ─────────────────────────────── */
  .main {
    padding: 20px 24px;
    max-width: 1400px;
    margin: 0 auto;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 12px;
  }

  .empty-state {
    grid-column: 1 / -1;
    text-align: center;
    padding: 80px 20px;
    color: var(--ink3);
  }
  .empty-state p { margin-top: 8px; font-size: 13px; }

  /* ── Pain Point Card ─────────────────────────────── */
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
    transition: border-color .15s;
    position: relative;
  }
  .card:hover { border-color: var(--surface3); }

  .card-accent {
    height: 3px;
    width: 100%;
  }
  .card[data-scenario="面试"] .card-accent { background: var(--c-ms); }
  .card[data-scenario="谈薪"] .card-accent { background: var(--c-tx); }
  .card[data-scenario="汇报"] .card-accent { background: var(--c-hb); }
  .card[data-scenario="向上管理"] .card-accent { background: var(--c-xs); }

  .card-body { padding: 14px 14px 10px; }

  .card-meta {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 10px;
  }

  .badge {
    padding: 2px 8px;
    border-radius: 3px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }

  .badge-scenario {
    color: #fff;
  }
  .badge-scenario[data-s="面试"]       { background: var(--c-ms); }
  .badge-scenario[data-s="谈薪"]       { background: var(--c-tx); }
  .badge-scenario[data-s="汇报"]       { background: var(--c-hb); }
  .badge-scenario[data-s="向上管理"]   { background: var(--c-xs); }

  .badge-sev { color: #fff; }
  .badge-sev[data-s="高"] { background: var(--sev-h); }
  .badge-sev[data-s="中"] { background: var(--sev-m); }
  .badge-sev[data-s="低"] { background: var(--sev-l); }

  .badge-status {
    padding: 2px 8px;
    border-radius: 3px;
    font-size: 11px;
    border: 1px solid var(--line);
    color: var(--ink3);
    cursor: pointer;
    background: transparent;
    transition: all .15s;
  }
  .badge-status:hover { border-color: var(--ink3); color: var(--ink2); }
  .badge-status.used { border-color: var(--c-tx); color: var(--c-tx); }
  .badge-status.planned { border-color: var(--c-ms); color: var(--c-ms); }

  .card-id { margin-left: auto; font-size: 11px; color: var(--ink3); }

  .trigger {
    font-size: 14px;
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 6px;
    line-height: 1.5;
  }

  .card-expand-btn {
    display: flex;
    align-items: center;
    gap: 4px;
    background: none;
    border: none;
    color: var(--ink3);
    font-size: 12px;
    cursor: pointer;
    padding: 0;
    margin-bottom: 4px;
    transition: color .15s;
  }
  .card-expand-btn:hover { color: var(--ink2); }
  .card-expand-btn svg { transition: transform .2s; }
  .card.expanded .card-expand-btn svg { transform: rotate(180deg); }

  .card-details {
    display: none;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--line);
  }
  .card.expanded .card-details { display: block; }

  .detail-row {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
  }
  .detail-label {
    font-size: 11px;
    color: var(--gold-dim);
    font-weight: 600;
    white-space: nowrap;
    padding-top: 1px;
    width: 48px;
    flex-shrink: 0;
  }
  .detail-text {
    font-size: 13px;
    color: var(--ink2);
    line-height: 1.6;
  }

  .card-footer {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    border-top: 1px solid var(--line);
    background: var(--surface2);
  }

  .url-input {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--ink3);
    font-size: 11px;
    outline: none;
    min-width: 0;
  }
  .url-input::placeholder { color: var(--ink3); }
  .url-input:focus { color: var(--ink2); }

  .card-btn {
    background: none;
    border: none;
    color: var(--ink3);
    cursor: pointer;
    padding: 3px 5px;
    border-radius: 4px;
    transition: all .15s;
    display: flex;
    align-items: center;
    font-size: 11px;
    gap: 3px;
  }
  .card-btn:hover { color: var(--ink2); background: var(--surface3); }
  .card-btn.delete:hover { color: var(--sev-h); }

  /* ── Modal ─────────────────────────────── */
  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.7);
    z-index: 200;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .overlay.open { display: flex; }

  .modal {
    background: var(--surface);
    border: 1px solid var(--surface3);
    border-radius: 12px;
    width: 100%;
    max-width: 680px;
    max-height: 90vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .modal-header {
    padding: 18px 20px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .modal-title {
    font-size: 16px;
    font-weight: 600;
    color: var(--gold);
    flex: 1;
  }

  .modal-close {
    background: none;
    border: none;
    color: var(--ink3);
    cursor: pointer;
    padding: 4px;
    border-radius: 4px;
    display: flex;
    transition: color .15s;
  }
  .modal-close:hover { color: var(--ink); }

  .modal-body {
    padding: 18px 20px;
    overflow-y: auto;
    flex: 1;
  }

  .modal-label {
    font-size: 12px;
    color: var(--gold-dim);
    font-weight: 600;
    margin-bottom: 6px;
    letter-spacing: 0.04em;
  }

  .extract-textarea {
    width: 100%;
    min-height: 140px;
    background: var(--surface2);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    color: var(--ink);
    font-size: 13px;
    padding: 10px 12px;
    resize: vertical;
    outline: none;
    line-height: 1.7;
    font-family: inherit;
  }
  .extract-textarea:focus { border-color: var(--gold-dim); }
  .extract-textarea::placeholder { color: var(--ink3); }

  .extract-hint {
    font-size: 11px;
    color: var(--ink3);
    margin-top: 6px;
  }

  .modal-actions {
    display: flex;
    gap: 8px;
    margin-top: 14px;
  }

  .btn-primary {
    background: var(--gold);
    color: #1a1a14;
    border: none;
    padding: 8px 20px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity .15s;
  }
  .btn-primary:hover { opacity: 0.85; }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }

  .btn-secondary {
    background: var(--surface2);
    color: var(--ink2);
    border: 1px solid var(--line);
    padding: 8px 16px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    cursor: pointer;
    transition: all .15s;
  }
  .btn-secondary:hover { border-color: var(--ink3); color: var(--ink); }

  .extract-status {
    margin-top: 12px;
    font-size: 13px;
    color: var(--ink3);
    min-height: 20px;
  }
  .extract-status.loading { color: var(--gold-dim); }
  .extract-status.error { color: var(--sev-h); }
  .extract-status.success { color: var(--c-tx); }

  .extract-results {
    margin-top: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .result-card {
    background: var(--surface2);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    position: relative;
  }

  .result-card-meta {
    display: flex;
    gap: 6px;
    margin-bottom: 8px;
    align-items: center;
  }

  .result-card .trigger-text {
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 6px;
  }

  .result-row {
    display: flex;
    gap: 6px;
    margin-bottom: 4px;
  }
  .result-label {
    font-size: 11px;
    color: var(--gold-dim);
    font-weight: 600;
    width: 44px;
    flex-shrink: 0;
    padding-top: 2px;
  }
  .result-val {
    font-size: 12px;
    color: var(--ink2);
    line-height: 1.6;
  }

  .result-add-btn {
    position: absolute;
    top: 10px;
    right: 10px;
    background: none;
    border: 1px solid var(--line);
    color: var(--ink3);
    padding: 3px 8px;
    border-radius: 4px;
    font-size: 11px;
    cursor: pointer;
    transition: all .15s;
  }
  .result-add-btn:hover { border-color: var(--c-tx); color: var(--c-tx); }
  .result-add-btn.added { border-color: var(--c-tx); color: var(--c-tx); background: rgba(46,158,107,0.1); }

  .add-all-row {
    display: flex;
    justify-content: flex-end;
    margin-top: 6px;
  }

  .btn-add-all {
    background: rgba(46,158,107,0.15);
    border: 1px solid var(--c-tx);
    color: var(--c-tx);
    padding: 6px 16px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity .15s;
  }
  .btn-add-all:hover { opacity: 0.8; }
  .btn-add-all:disabled { opacity: 0.4; cursor: not-allowed; }

  /* ── Toast ─────────────────────────────── */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--surface3);
    color: var(--ink);
    padding: 10px 20px;
    border-radius: 20px;
    font-size: 13px;
    z-index: 300;
    opacity: 0;
    transition: all .25s;
    pointer-events: none;
    white-space: nowrap;
    border: 1px solid var(--line);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ── Loading spinner ─────────────────────────────── */
  .spinner {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid var(--line);
    border-top-color: var(--gold-dim);
    border-radius: 50%;
    animation: spin .6s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Responsive ─────────────────────────────── */
  @media (max-width: 640px) {
    .header { padding: 12px 16px; }
    .header-stats { display: none; }
    .filters { padding: 8px 16px; gap: 8px; }
    .main { padding: 14px 16px; }
    .grid { grid-template-columns: 1fr; }
    .tabs { overflow-x: auto; padding-bottom: 2px; }
  }
</style>
</head>
<body>

<!-- Header -->
<header class="header">
  <div class="header-title">职场表达力 · 痛点库</div>
  <div class="header-stats" id="headerStats"></div>
  <div class="header-right">
    <button class="btn-extract" onclick="openExtract()">✦ AI 提炼痛点</button>
  </div>
</header>

<!-- Filters -->
<div class="filters">
  <div class="tabs">
    <button class="tab active" data-scenario="all" onclick="setScenario('all')">全部</button>
    <button class="tab" data-scenario="面试" onclick="setScenario('面试')">面试</button>
    <button class="tab" data-scenario="谈薪" onclick="setScenario('谈薪')">谈薪</button>
    <button class="tab" data-scenario="汇报" onclick="setScenario('汇报')">汇报</button>
    <button class="tab" data-scenario="向上管理" onclick="setScenario('向上管理')">向上管理</button>
  </div>
  <div class="divider"></div>
  <select class="filter-select" id="sevFilter" onchange="applyFilters()">
    <option value="">严重度</option>
    <option value="高">高</option>
    <option value="中">中</option>
    <option value="低">低</option>
  </select>
  <select class="filter-select" id="statusFilter" onchange="applyFilters()">
    <option value="">状态</option>
    <option value="未使用">未使用</option>
    <option value="已规划">已规划</option>
    <option value="已出稿">已出稿</option>
  </select>
  <div class="search-wrap">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
    </svg>
    <input class="search-input" id="searchInput" type="text" placeholder="搜索痛点…" oninput="applyFilters()">
  </div>
  <div class="result-count" id="resultCount"></div>
</div>

<!-- Main -->
<main class="main">
  <div class="grid" id="grid">
    <div class="empty-state">
      <div class="spinner"></div>
      <p>加载中…</p>
    </div>
  </div>
</main>

<!-- AI 提炼 Modal -->
<div class="overlay" id="extractOverlay" onclick="closeExtractOnBg(event)">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">✦ AI 提炼痛点</div>
      <button class="modal-close" onclick="closeExtract()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 6L6 18M6 6l12 12"/>
        </svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="modal-label">粘贴内容</div>
      <textarea class="extract-textarea" id="extractInput"
        placeholder="粘贴小红书评论、私信、学员反馈、用户访谈记录等任何文本内容…&#10;&#10;AI 会自动识别其中「说错/说少/说不出」的表达痛点。"></textarea>
      <div class="extract-hint">支持评论截图文字、私信记录、访谈整理，任意格式均可</div>
      <div class="modal-actions">
        <button class="btn-primary" id="extractBtn" onclick="doExtract()">开始提炼</button>
        <button class="btn-secondary" onclick="closeExtract()">取消</button>
      </div>
      <div class="extract-status" id="extractStatus"></div>
      <div class="extract-results" id="extractResults"></div>
      <div class="add-all-row" id="addAllRow" style="display:none">
        <button class="btn-add-all" id="addAllBtn" onclick="addAllResults()">全部加入库</button>
      </div>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ─── State ───────────────────────────────────────────────────────────
let allPoints = [];
let currentScenario = 'all';
let extractedItems = [];

// ─── Boot ───────────────────────────────────────────────────────────
async function boot() {
  await Promise.all([loadPoints(), loadStats()]);
}

async function loadPoints() {
  try {
    const res = await fetch('/api/pain-points');
    allPoints = await res.json();
    applyFilters();
  } catch (e) {
    document.getElementById('grid').innerHTML =
      `<div class="empty-state">⚠ 无法连接服务器<p>请确认后端已启动：<code>python app.py</code></p></div>`;
  }
}

async function loadStats() {
  try {
    const res = await fetch('/api/stats');
    const s = await res.json();
    renderStats(s);
  } catch (e) {}
}

// ─── Stats Header ────────────────────────────────────────────────────
function renderStats(s) {
  const scenarios = [
    { key: '面试', color: '#3b7dd8' },
    { key: '谈薪', color: '#2e9e6b' },
    { key: '汇报', color: '#d87a3b' },
    { key: '向上管理', color: '#8b5cf6' },
  ];
  const el = document.getElementById('headerStats');
  el.innerHTML = `<div class="stat-chip">
    <span class="count">${s.total}</span> 条痛点
  </div>` + scenarios.map(sc =>
    `<div class="stat-chip">
      <span class="dot" style="background:${sc.color}"></span>
      ${sc.key} <span class="count">${s.by_scenario[sc.key] || 0}</span>
    </div>`
  ).join('');
}

// ─── Filters ─────────────────────────────────────────────────────────
function setScenario(s) {
  currentScenario = s;
  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('active', t.dataset.scenario === s);
  });
  applyFilters();
}

function applyFilters() {
  const sev = document.getElementById('sevFilter').value;
  const status = document.getElementById('statusFilter').value;
  const q = document.getElementById('searchInput').value.trim().toLowerCase();

  let filtered = allPoints.filter(p => {
    if (currentScenario !== 'all' && p.scenario !== currentScenario) return false;
    if (sev && p.severity !== sev) return false;
    if (status && p.status !== status) return false;
    if (q && !`${p.trigger_moment} ${p.inner_monologue} ${p.actual_consequence}`.toLowerCase().includes(q)) return false;
    return true;
  });

  document.getElementById('resultCount').textContent = `${filtered.length} 条`;
  renderGrid(filtered);
}

// ─── Grid Render ─────────────────────────────────────────────────────
function renderGrid(points) {
  const grid = document.getElementById('grid');
  if (!points.length) {
    grid.innerHTML = `<div class="empty-state">没有匹配的痛点<p>换个筛选条件试试</p></div>`;
    return;
  }
  grid.innerHTML = points.map(p => renderCard(p)).join('');
}

function renderCard(p) {
  const statusClass = p.status === '已出稿' ? 'used' : p.status === '已规划' ? 'planned' : '';
  const urlDisplay = p.content_url || '';
  return `
  <div class="card" data-scenario="${esc(p.scenario)}" data-id="${p.id}">
    <div class="card-accent"></div>
    <div class="card-body">
      <div class="card-meta">
        <span class="badge badge-scenario" data-s="${esc(p.scenario)}">${esc(p.scenario)}</span>
        <span class="badge badge-sev" data-s="${esc(p.severity)}">${esc(p.severity)}</span>
        <button class="badge-status ${statusClass}" onclick="cycleStatus(${p.id}, this)">${esc(p.status)}</button>
        <span class="card-id">#${p.id}</span>
      </div>
      <div class="trigger">${esc(p.trigger_moment)}</div>
      <button class="card-expand-btn" onclick="toggleCard(this)">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
        展开详情
      </button>
      <div class="card-details">
        <div class="detail-row">
          <div class="detail-label">独白</div>
          <div class="detail-text">${esc(p.inner_monologue)}</div>
        </div>
        <div class="detail-row">
          <div class="detail-label">后果</div>
          <div class="detail-text">${esc(p.actual_consequence)}</div>
        </div>
      </div>
    </div>
    <div class="card-footer">
      <input class="url-input" type="text" placeholder="笔记 URL…"
        value="${esc(urlDisplay)}"
        onblur="saveUrl(${p.id}, this.value)"
        onkeydown="if(event.key==='Enter') this.blur()">
      <button class="card-btn delete" title="删除" onclick="deleteCard(${p.id})">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/>
          <path d="M9 6V4h6v2"/>
        </svg>
      </button>
    </div>
  </div>`;
}

function esc(s) {
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ─── Card Actions ─────────────────────────────────────────────────────
function toggleCard(btn) {
  const card = btn.closest('.card');
  card.classList.toggle('expanded');
  btn.querySelector('+ .card-details') // not needed
  btn.innerHTML = card.classList.contains('expanded')
    ? `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg> 收起`
    : `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg> 展开详情`;
}

const STATUS_CYCLE = ['未使用', '已规划', '已出稿'];

async function cycleStatus(id, btn) {
  const cur = btn.textContent.trim();
  const next = STATUS_CYCLE[(STATUS_CYCLE.indexOf(cur) + 1) % STATUS_CYCLE.length];
  try {
    await fetch(`/api/pain-points/${id}`, {
      method: 'PUT',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({status: next})
    });
    const point = allPoints.find(p => p.id === id);
    if (point) point.status = next;
    btn.textContent = next;
    btn.className = 'badge-status ' + (next === '已出稿' ? 'used' : next === '已规划' ? 'planned' : '');
    toast(`已标记为「${next}」`);
  } catch (e) { toast('保存失败', true); }
}

async function saveUrl(id, url) {
  try {
    await fetch(`/api/pain-points/${id}`, {
      method: 'PUT',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({content_url: url, status: url ? '已出稿' : undefined})
    });
    const point = allPoints.find(p => p.id === id);
    if (point) { point.content_url = url; if (url) point.status = '已出稿'; }
    if (url) toast('URL 已保存');
  } catch (e) {}
}

async function deleteCard(id) {
  if (!confirm('确认删除这条痛点？')) return;
  try {
    await fetch(`/api/pain-points/${id}`, { method: 'DELETE' });
    allPoints = allPoints.filter(p => p.id !== id);
    applyFilters();
    loadStats();
    toast('已删除');
  } catch (e) { toast('删除失败', true); }
}

// ─── Extract Modal ────────────────────────────────────────────────────
function openExtract() {
  document.getElementById('extractOverlay').classList.add('open');
  document.getElementById('extractInput').focus();
}

function closeExtract() {
  document.getElementById('extractOverlay').classList.remove('open');
}

function closeExtractOnBg(e) {
  if (e.target === e.currentTarget) closeExtract();
}

async function doExtract() {
  const content = document.getElementById('extractInput').value.trim();
  if (!content) { toast('请先粘贴内容', true); return; }

  const btn = document.getElementById('extractBtn');
  const status = document.getElementById('extractStatus');
  const results = document.getElementById('extractResults');
  const addAllRow = document.getElementById('addAllRow');

  btn.disabled = true;
  btn.textContent = '提炼中…';
  status.className = 'extract-status loading';
  status.innerHTML = '<span class="spinner"></span> 正在分析，请稍候…';
  results.innerHTML = '';
  addAllRow.style.display = 'none';
  extractedItems = [];

  try {
    const res = await fetch('/api/extract', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({content})
    });
    const data = await res.json();

    if (!res.ok) {
      status.className = 'extract-status error';
      status.textContent = data.detail || '提炼失败，请检查 API Key 配置';
      return;
    }

    if (data.error) {
      status.className = 'extract-status error';
      status.textContent = `解析失败：${data.error}`;
      if (data.raw) {
        results.innerHTML = `<pre style="font-size:11px;color:var(--ink3);white-space:pre-wrap;overflow-x:auto">${esc(data.raw)}</pre>`;
      }
      return;
    }

    extractedItems = data.items || [];
    if (!extractedItems.length) {
      status.className = 'extract-status';
      status.textContent = '未提取到痛点，尝试换一段更有情感色彩的内容';
      return;
    }

    status.className = 'extract-status success';
    status.textContent = `✓ 提炼出 ${extractedItems.length} 条痛点`;
    results.innerHTML = extractedItems.map((it, i) => renderResultCard(it, i)).join('');
    addAllRow.style.display = 'flex';
    document.getElementById('addAllBtn').disabled = false;
    document.getElementById('addAllBtn').textContent = `全部加入库（${extractedItems.length} 条）`;

  } catch (e) {
    status.className = 'extract-status error';
    status.textContent = '网络错误，请检查后端是否运行中';
  } finally {
    btn.disabled = false;
    btn.textContent = '开始提炼';
  }
}

function renderResultCard(it, i) {
  return `
  <div class="result-card" data-idx="${i}">
    <div class="result-card-meta">
      <span class="badge badge-scenario" data-s="${esc(it.scenario)}">${esc(it.scenario)}</span>
      <span class="badge badge-sev" data-s="${esc(it.severity)}">${esc(it.severity)}</span>
    </div>
    <div class="trigger-text">${esc(it.trigger_moment)}</div>
    <div class="result-row">
      <div class="result-label">独白</div>
      <div class="result-val">${esc(it.inner_monologue)}</div>
    </div>
    <div class="result-row">
      <div class="result-label">后果</div>
      <div class="result-val">${esc(it.actual_consequence)}</div>
    </div>
    <button class="result-add-btn" onclick="addSingleResult(${i}, this)">+ 加入库</button>
  </div>`;
}

async function addSingleResult(idx, btn) {
  const it = extractedItems[idx];
  if (!it) return;
  try {
    const res = await fetch('/api/pain-points', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({...it, source: 'extracted'})
    });
    const newPoint = await res.json();
    allPoints.unshift(newPoint);
    applyFilters();
    loadStats();
    btn.textContent = '✓ 已加入';
    btn.className = 'result-add-btn added';
    btn.disabled = true;
    toast('已加入痛点库');
  } catch (e) { toast('保存失败', true); }
}

async function addAllResults() {
  const btn = document.getElementById('addAllBtn');
  btn.disabled = true;
  btn.textContent = '加入中…';

  const btns = document.querySelectorAll('.result-add-btn:not(.added)');
  let added = 0;
  for (const [i, it] of extractedItems.entries()) {
    const cardBtn = document.querySelector(`.result-card[data-idx="${i}"] .result-add-btn`);
    if (cardBtn?.classList.contains('added')) continue;
    try {
      const res = await fetch('/api/pain-points', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({...it, source: 'extracted'})
      });
      const newPoint = await res.json();
      allPoints.unshift(newPoint);
      if (cardBtn) { cardBtn.textContent = '✓ 已加入'; cardBtn.className = 'result-add-btn added'; cardBtn.disabled = true; }
      added++;
    } catch (e) {}
  }
  applyFilters();
  loadStats();
  btn.textContent = `✓ 已全部加入（${added} 条）`;
  toast(`${added} 条痛点已加入库`);
}

// ─── Toast ────────────────────────────────────────────────────────────
let toastTimer;
function toast(msg, isError = false) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.background = isError ? 'rgba(200,60,60,0.9)' : '';
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2400);
}

// ─── Init ────────────────────────────────────────────────────────────
boot();
</script>
</body>
</html>
