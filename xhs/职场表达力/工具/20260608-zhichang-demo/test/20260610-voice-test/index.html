<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>声音测试 — S1 10秒</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        width: 1920px; height: 1080px;
        overflow: hidden; background: #1a1a1a;
      }

      #root {
        position: relative;
        width: 1920px; height: 1080px;
        overflow: hidden;
        background: linear-gradient(160deg, #1a1a1a 60%, #2e2614 100%);
        font-family: system-ui, "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      }

      /* Gold micro-grid */
      #root::before {
        content: "";
        position: absolute; inset: 0;
        background-image:
          linear-gradient(rgba(232,213,163,0.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(232,213,163,0.05) 1px, transparent 1px);
        background-size: 60px 60px;
        pointer-events: none; z-index: 0;
      }

      /* Badge */
      #badge {
        position: absolute; top: 36px; left: 52px;
        display: flex; align-items: center; gap: 12px; z-index: 10;
      }
      .badge-dot { width: 7px; height: 7px; border-radius: 50%; background: #e8d5a3; flex-shrink: 0; }
      .badge-text { font-size: 21px; font-weight: 600; letter-spacing: 0.12em; color: rgba(232,213,163,0.65); }
      .badge-sep { width: 1px; height: 16px; background: rgba(232,213,163,0.25); flex-shrink: 0; }

      /* Sig strip */
      #sig {
        position: absolute; bottom: 0; left: 0; right: 0;
        height: 58px;
        background: rgba(232,213,163,0.04);
        border-top: 1px solid rgba(232,213,163,0.1);
        display: flex; align-items: center; justify-content: center; gap: 28px; z-index: 10;
      }
      .sig-line { width: 40px; height: 1px; background: rgba(232,213,163,0.22); }
      .sig-text { font-size: 19px; font-weight: 500; letter-spacing: 0.18em; color: rgba(232,213,163,0.65); }

      /* FX */
      #flash { position: absolute; inset: 0; background: #fff; z-index: 80; pointer-events: none; opacity: 0; }
      #vignette {
        position: absolute; inset: 0;
        background: radial-gradient(ellipse at 50% 50%, transparent 40%, rgba(0,0,0,0.72) 100%);
        pointer-events: none; z-index: 6;
      }
      #light-leak {
        position: absolute; inset: 0;
        background:
          radial-gradient(ellipse at 5% 10%, rgba(255,215,130,0.72) 0%, transparent 42%),
          radial-gradient(ellipse at 95% 88%, rgba(232,180,80,0.52) 0%, transparent 36%);
        mix-blend-mode: screen;
        pointer-events: none; z-index: 7; opacity: 0;
      }

      /* Grain */
      @keyframes hf-grain {
        0%,100% { transform: translate(0,0); }
        10%  { transform: translate(-5%,-5%); }
        20%  { transform: translate(-10%,5%); }
        30%  { transform: translate(5%,-10%); }
        40%  { transform: translate(-5%,15%); }
        50%  { transform: translate(-10%,5%); }
        60%  { transform: translate(15%,0); }
        70%  { transform: translate(0,10%); }
        80%  { transform: translate(-15%,0); }
        90%  { transform: translate(10%,5%); }
      }
      #grain { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 100; }
      #grain::after {
        content: "";
        position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
        background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        opacity: 0.038;
        animation: hf-grain 0.5s steps(1) infinite;
      }

      /* Scene */
      .scene {
        position: absolute; inset: 0; z-index: 5;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
      }

      /* S1 */
      #s1-label {
        font-size: 26px; font-weight: 700;
        letter-spacing: 0.38em; color: rgba(232,213,163,0.42);
        margin-bottom: 32px;
      }
      #s1-line1 {
        font-size: 114px; font-weight: 900; color: #e8d5a3;
        letter-spacing: 0.05em; line-height: 1;
        text-shadow: 0 0 80px rgba(232,213,163,0.28);
        margin-bottom: 4px;
      }
      #s1-line2 {
        font-size: 114px; font-weight: 900; color: #e8d5a3;
        letter-spacing: 0.05em; line-height: 1;
        text-shadow: 0 0 80px rgba(232,213,163,0.28);
        margin-bottom: 40px;
      }
      #s1-sub {
        font-size: 42px; font-weight: 400;
        color: rgba(232,213,163,0.45); letter-spacing: 0.22em;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="test-voice-s1"
      data-start="0"
      data-duration="12.5"
      data-width="1920"
      data-height="1080"
    >
      <!-- Persistent chrome -->
      <div id="badge" class="clip" data-start="0" data-duration="12.5" data-track-index="10">
        <span class="badge-dot"></span>
        <span class="badge-text">职场表达力</span>
        <span class="badge-sep"></span>
        <span class="badge-text">说话的顺序</span>
      </div>
      <div id="sig" class="clip" data-start="0" data-duration="12.5" data-track-index="11">
        <span class="sig-line"></span>
        <span class="sig-text">结论先行</span>
        <span class="sig-line"></span>
      </div>

      <!-- FX layers -->
      <div id="flash"></div>
      <div id="vignette"></div>
      <div id="light-leak"></div>
      <div id="grain"></div>

      <!-- S1: HOOK -->
      <div id="s1" class="scene clip" data-start="0" data-duration="12.5" data-track-index="1">
        <span id="s1-label">HOOK</span>
        <div id="s1-line1">开口</div>
        <div id="s1-line2">全场停下来</div>
        <div id="s1-sub">话不多，但有分量</div>
      </div>

      <!-- Audio VO -->
      <audio
        id="vo1"
        class="clip"
        src="assets/vo1.wav"
        data-start="0.4"
        data-duration="11.602"
        data-track-index="2"
        data-volume="1"
      ></audio>

      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // S1 entrances
        tl.from("#s1-label", { y: -22, opacity: 0, duration: 0.44, ease: "power3.out" }, 0.1);
        tl.from("#s1-line1", { y: 80, scaleY: 1.55, transformOrigin: "center bottom", duration: 0.3, ease: "power4.out" }, 0.24);
        tl.from("#s1-line2", { y: 80, scaleY: 1.55, transformOrigin: "center bottom", duration: 0.3, ease: "power4.out" }, 0.36);
        tl.from("#s1-sub",   { y: 18, opacity: 0, duration: 0.5, ease: "power3.out" }, 0.56);

        // Badge / sig entrances
        tl.from("#badge", { y: -16, opacity: 0, duration: 0.5, ease: "power2.out" }, 0.05);
        tl.from("#sig",   { y: 16,  opacity: 0, duration: 0.5, ease: "power2.out" }, 0.05);

        // Light-leak pulse mid-scene
        tl.to("#light-leak", { opacity: 0.18, duration: 1.2, ease: "power2.out" }, 1.0);
        tl.to("#light-leak", { opacity: 0,    duration: 2.0, ease: "power2.in" },  3.0);

        // Final fade to black (final scene — allowed)
        tl.to("#s1",    { opacity: 0, duration: 0.7, ease: "power2.in" }, 11.0);
        tl.to("#badge", { opacity: 0, duration: 0.5, ease: "power2.in" }, 11.1);
        tl.to("#sig",   { opacity: 0, duration: 0.5, ease: "power2.in" }, 11.1);

        // Flash at end
        tl.to("#flash", { opacity: 0.55, duration: 0.08, ease: "power4.in" },  11.8);
        tl.to("#flash", { opacity: 0,    duration: 0.45, ease: "power2.out" }, 11.88);

        window.__timelines["test-voice-s1"] = tl;
      </script>
    </div>
  </body>
</html>
