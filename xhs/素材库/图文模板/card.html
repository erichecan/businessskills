<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  :root { --ink:#1c1c1c; --accent:#c0392b; --gold:#8a6d2f; --paper:#fafaf7; }
  * { margin:0; box-sizing:border-box; }
  body { width:1242px; height:1660px; background:var(--paper); color:var(--ink);
         font-family:"PingFang SC","Hiragino Sans GB",sans-serif; display:flex; }
  /* height:100% + border-box 是让 flex 收缩生效的前提：原来 .card 不设高度，
     高度由内容撑开，flex 容器永远没有负 free space，flex-shrink 从不触发 ——
     图片始终按 height 渲染，超出 body 1660px 的部分被截图直接切掉（人物下半身没了）。
     调 flex-shrink / min-height 都治不了，因为那是参数，这是结构。 */
  .card { display:flex; flex-direction:column; padding:96px 88px; width:100%;
          height:100%; box-sizing:border-box; position:relative; }
  /* ⛔ 头像原来是 position:absolute; right:88px; bottom:200px; width:300px。
     absolute 脱离文档流，正文**不知道它存在** —— 文案一长就被它盖住。
     2026-08-08 实测「空降后下属不服管」封面：
       「你兑现的第一件小事，比你开的三[被头像盖掉]用。」
     一句话读者读不完整。而且是**条件触发**：文案短的卡（如「绩效被打低分」）
     完全正常，所以它一直没被发现 —— 又一个静默失败。
     同一个文件里 .poseimg（flex 项）有 LINE_BUDGET 兜底，头像却没有，
     这处不对称就是根因。

     改法不是给它加保护，是把它挪进页脚署名条 —— 它本来就该是「签名」，
     不是画面主体（见下方 .foot 与 §视觉锤的判断）。挪进 flex 流之后
     无论文案多长都不可能再压到正文。 */
  .ipimg { width:104px; height:104px; border-radius:50%; object-fit:cover;
           border:4px solid #fff; box-shadow:0 4px 14px rgba(0,0,0,.16); flex:none; }
  /* height 而非 max-height：姿势图裁掉透明边距后只有 208-384px 高，
     max-height 是上限不是目标，图会按自身尺寸渲染，人物在 1660px 画布上只占一小块。
     设定 height 让所有姿势统一放大到同一视觉高度（原图 246×410 级别，放大约 1.5-2.2 倍；
     手绘线稿对放大的容忍度比照片高）。 */
  /* 自适应：height 给目标值、flex-shrink 允许被压、min-height 兜底。
     ① 原来写 max-height:460px 是上限不是目标 —— 姿势图裁掉透明边距后只有 208-384px 高，
        够不着上限，就按自身尺寸渲染，人物在 1660px 画布上只占一小块。
     ② 但 flex-shrink:0 + 固定 520px 会让文字多的卡直接溢出画布（人物下半身被切）。
     ③ 必须显式 min-height:0。flex item 的 min-height 默认是 auto，对 <img> 会解析成
        图片固有高度（裁剪后 246×304），照样挡住收缩 —— 删掉这行不等于设 0，
        quote 卡型（.quote 用了 margin:auto 0 抢空间）会被顶出画布下沿。
     结论：height 给目标值 + 允许自由压缩。文案短的卡图能撑到 500px，
     文案长的卡自动压到可用空间。要图更大就得让卡片文案更短 —— 版面守恒，不是参数问题。 */
  .poseimg { align-self:center; margin-top:auto; margin-bottom:40px;
             height:500px; min-height:0; width:auto; max-width:78%;
             object-fit:contain; mix-blend-mode:multiply; }
  .tag { font-size:34px; letter-spacing:.2em; color:var(--gold); margin-bottom:48px; }
  .idx { position:absolute; top:96px; right:88px; font-size:36px; color:#b9b3a6; }
  h1 { font-size:104px; line-height:1.35; font-weight:800; }
  h1 .hl { color:var(--accent); }
  .sub { font-size:52px; line-height:1.6; margin-top:64px; color:#444; }
  .quote { font-size:72px; line-height:1.5; font-weight:700; margin:auto 0;
           border-left:14px solid var(--accent); padding-left:48px; }
  .body { font-size:54px; line-height:1.75; margin-top:56px; white-space:pre-line; }
  .foot { margin-top:auto; font-size:36px; color:#8d876f; border-top:2px solid #ddd6c4;
          padding-top:32px; display:flex; align-items:center; gap:24px; }
  /* 卡型微调 */
  .cover h1 { font-size:118px; }
  .cover .sub { font-size:56px; font-weight:600; color:var(--ink); }
  /* 封面变体 A：大形象居中 */
  .coverbig h1 { font-size:118px; }
  .coverbig .poseimg { max-height:720px; max-width:80%; margin-bottom:140px; }
  /* 封面变体 B：形象+对话气泡（角色说出结论） */
  .covertalk h1 { font-size:104px; }
  .covertalk .poseimg { position:absolute; left:64px; bottom:150px; max-height:560px; max-width:44%; margin:0; }
  .covertalk .quote { position:absolute; right:88px; bottom:480px; left:560px;
    border:7px solid var(--ink); border-radius:56px; padding:44px 52px;
    font-size:58px; line-height:1.5; font-weight:700; background:#fff; }
  .covertalk .quote:after { content:""; position:absolute; left:-40px; bottom:60px;
    border:22px solid transparent; border-right-color:var(--ink); }
  /* 封面变体 C：上文下图分栏 */
  .coversplit h1 { font-size:108px; }
  .coversplit .poseimg { max-height:560px; max-width:74%; margin-bottom:110px;
    border-top:3px solid #ddd6c4; padding-top:60px; }
  .contrast .bad { color:#8d876f; text-decoration:line-through; }
</style>
</head>
<body>
  <div class="card {{TYPE}}">
    <div class="tag">{{TAG}}</div>
    <div class="idx">{{IDX}}/7</div>
    <h1>{{TITLE}}</h1>
    {{QUOTE_BLOCK}}
    <div class="body">{{BODY}}</div>
    {{POSE_BLOCK}}
    <div class="foot">{{IP_BLOCK}}<span>只说你需要的，帮你看清楚职场</span></div>
  </div>
</body>
</html>
